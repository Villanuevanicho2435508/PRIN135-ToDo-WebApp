<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <h1>Todo List</h1>

        <form class="action">

            <input
                id="todo-name"
                type="text"
                placeholder="What needs to be done?"
            >

            <input
                id="todo-hours"
                type="number"
                value="0"
                min="0"
            >

            <button type="button">Add</button>

        </form>

        <div class="filters">

            <div>

                <input type="radio" id="all" name="filter" checked>
                <label for="all">All</label>

                <input type="radio" id="active" name="filter">
                <label for="active">Active</label>

                <input type="radio" id="completed" name="filter">
                <label for="completed">Completed</label>

            </div>

            <button type="button">Mark all done</button>

        </div>

        <section class="tasks">

            <div class="task">

                <span>
                    <input type="checkbox" id="task1">
                    <label for="task1" class="task-name">
                        Reply to emails
                    </label>
                </span>

                <span>
                    <span class="badge">Easy · 1h</span>
                    <button type="button" class="remove-task">×</button>
                </span>

            </div>

            <hr>

            <div class="task">

                <span>
                    <input type="checkbox" id="task2">
                    <label for="task2" class="task-name">
                        Fix login bug
                    </label>
                </span>

                <span>
                    <span class="badge-medium">Medium · 4h</span>
                    <button type="button" class="remove-task">×</button>
                </span>

            </div>

            <hr>

            <div class="task">

                <span>
                    <input type="checkbox" id="task3">
                    <label for="task3" class="task-name">
                        Build reports page
                    </label>
                </span>

                <span>
                    <span class="badge-hard">Hard · 6h</span>
                    <button type="button" class="remove-task">×</button>
                </span>

            </div>

            <hr>

            <div class="task">

                <span>
                    <input type="checkbox" id="task4" checked>
                    <label for="task4" class="task-name">
                        Plan sprint
                    </label>
                </span>

                <span>
                    <span class="badge">Easy · 2h</span>
                    <button type="button" class="remove-task">×</button>
                </span>

            </div>

            <hr>

        </section>

        <div class="item-count">

            <span>3 items left · 11 hours total</span>

            <button type="button">Clear completed</button>

        </div>

        <div class="footer">

            <div>
                Easy: up to 2h · Medium: over 2h · Hard: over 5h.
            </div>

            <div>
                Double-click a task or its label to edit the text or hours.
                Press Enter to save, Esc to cancel.
            </div>

        </div>

    </main>

</body>

</html>
